[project]
name = "server-saver"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.9",
]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,sns]>=1.42.9",
    "moto[ec2,sns]>=5.1.18",
